resources:
  jobs:
    orders_pipeline:
      name: orders-pipeline
      max_concurrent_runs: 1

      trigger:
        pause_status: UNPAUSED
        file_arrival:
          url: /Volumes/${var.catalog}/${var.schema}/inbound/
          min_time_between_triggers_seconds: 60
          wait_after_last_change_seconds: 65

      environments:
        - environment_key: serverless_env
          spec:
            client: "2"
            dependencies:
              - requests==2.32.3
              - databricks-sdk

      tasks:
        - task_key: bronze_silver_gold
          pipeline_task:
            pipeline_id: ${resources.pipelines.orders_dlt_pipeline.id}

        - task_key: publish_snapshot
          depends_on: [{ task_key: bronze_silver_gold }]
          environment_key: serverless_env
          spark_python_task:
            python_file: ../src/publish_snapshot.py
