resources:
  jobs:
    orders_pipeline:
      name: orders-pipeline
      max_concurrent_runs: 1

      trigger:
        pause_status: UNPAUSED
        file_arrival:
          url: /Volumes/${var.catalog}/${var.schema}/inbound/
          min_time_between_triggers_seconds: 60
          wait_after_last_change_seconds: 65

      environments:
        - environment_key: serverless_env
          spec:
            client: "2"   # confirm this is still the valid enum at deploy time (`databricks bundle deploy` will error if not)
            dependencies:
              - requests==2.32.3

      tasks:
        - task_key: bronze_ingest
          environment_key: serverless_env
          spark_python_task:
            python_file: ../src/bronze_ingest.py

        - task_key: silver_scd2
          depends_on: [{ task_key: bronze_ingest }]
          environment_key: serverless_env
          spark_python_task:
            python_file: ../src/silver_scd2.py

        - task_key: gold_and_publish
          depends_on: [{ task_key: silver_scd2 }]
          environment_key: serverless_env
          spark_python_task:
            python_file: ../src/gold_and_publish.py
